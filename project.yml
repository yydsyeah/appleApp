name: OfficeAssets
options:
  bundleIdPrefix: com.office
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
targets:
  OfficeAssets:
    type: application
    platform: iOS
    sources:
      - path: OfficeAssets
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.office.assets
        PRODUCT_NAME: OfficeAssets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OfficeAssets/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  OfficeAssets:
    build:
      targets:
        OfficeAssets: all
    run:
      config: Debug
    archive:
      config: Release
